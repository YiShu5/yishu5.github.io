<style>
:root{
  --ink:#0A1520;--blue2:#378ADD;
  --yellow:#f0b429;--orange:#cc6600;
  --purple:#534AB7;--purple2:#7F77DD;
  --dark:#1A1A2E;--pocket:#2A2A3E;
  --green:#2d6a2d;--gray:#5F5E5A;
  --cream:#f8f0dc;--cream2:#ede0c0;
  --brown:#4a2005;--red:#D85A30;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Serif SC','PingFang SC','Microsoft YaHei',serif;overflow-x:hidden;background:var(--ink);}

/* NAVBAR */
#navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(8,16,28,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(240,180,40,.12);}
.nav-a{color:rgba(255,255,255,.6);text-decoration:none;font-size:13px;letter-spacing:.06em;transition:color .2s;font-family:'PingFang SC','Microsoft YaHei',sans-serif;}
.nav-a:hover{color:var(--yellow)}
#mob-menu{display:none;flex-direction:column;gap:14px;padding:12px 20px 18px;}
#mob-menu.open{display:flex}

/* HERO */
#hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;}
#vg-canvas{position:absolute;inset:0;width:100%;height:100%;}
.hero-veil{position:absolute;inset:0;background:linear-gradient(to right,rgba(6,12,22,.95) 0%,rgba(6,12,22,.88) 30%,rgba(6,12,22,.55) 55%,rgba(6,12,22,.15) 72%,transparent 85%);}
.hero-txt{position:relative;z-index:2;padding:0 clamp(20px,5vw,80px);max-width:700px;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(240,180,40,.35);background:rgba(240,180,40,.08);color:rgba(240,180,40,.9);font-size:12px;letter-spacing:.1em;padding:5px 14px;border-radius:999px;margin-bottom:28px;font-family:sans-serif;}
#h-title{font-size:clamp(40px,6.5vw,88px);font-weight:900;color:#fff;line-height:1.08;letter-spacing:-.01em;text-shadow:0 4px 40px rgba(0,0,0,.6);opacity:0;transform:translateY(36px);}
#h-sub{font-size:clamp(14px,1.6vw,18px);color:rgba(255,255,255,.55);margin-top:20px;margin-bottom:36px;line-height:1.75;font-weight:400;max-width:480px;opacity:0;transform:translateY(20px);}
#h-btns{display:flex;gap:12px;flex-wrap:wrap;opacity:0;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:12px 28px;border-radius:6px;font-size:14px;font-weight:600;border:none;cursor:pointer;text-decoration:none;color:#fff;letter-spacing:.04em;transition:transform .18s,box-shadow .22s,background .2s;font-family:'PingFang SC',sans-serif;}
.btn:hover{transform:translateY(-2px);}
.btn-y{background:var(--yellow);color:#1a0800;box-shadow:0 4px 20px rgba(240,180,40,.3);}
.btn-y:hover{background:#ffc83a;box-shadow:0 8px 28px rgba(240,180,40,.45);}
.btn-g{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);}
.btn-g:hover{background:rgba(255,255,255,.17);}
.btn-p{background:var(--purple);box-shadow:0 4px 18px rgba(83,74,183,.35);}
.btn-p:hover{background:var(--purple2);}
.scroll-hint{position:absolute;bottom:36px;left:clamp(20px,5vw,80px);z-index:2;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.3);font-family:sans-serif;}
.scroll-line{width:40px;height:1px;background:rgba(255,255,255,.2);}

/* PRODUCTS */
#products{background:var(--cream);padding:80px clamp(16px,5vw,80px);}
.sec-title{font-size:clamp(22px,3.5vw,38px);font-weight:900;letter-spacing:.04em;line-height:1.1;}
.p-card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 20px rgba(74,32,5,.08);cursor:pointer;border:1px solid rgba(74,32,5,.08);transition:box-shadow .25s,transform .2s;}
.p-card:hover{transform:translateY(-6px);box-shadow:0 12px 40px rgba(74,32,5,.15);}
.flip-wrap{perspective:1000px;height:300px;}
.flip-inner{width:100%;height:100%;position:relative;transition:transform .7s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
.flip-wrap.flipped .flip-inner{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:7px;}
.flip-b{transform:rotateY(180deg);}

/* BOOKS */
#books{position:relative;padding:80px clamp(16px,5vw,80px);overflow:hidden;background:#06101e;}
#books-canvas{position:absolute;inset:0;width:100%;height:100%;}
#books-veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,10,20,.82) 0%,rgba(6,10,20,.72) 50%,rgba(6,10,20,.88) 100%);}
.book-card{
  display:flex;gap:16px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(240,180,40,.12);
  border-radius:10px;padding:16px;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.book-card:hover{transform:translateY(-4px);border-color:rgba(240,180,40,.35);box-shadow:0 8px 32px rgba(240,180,40,.08);}
.book-cover{
  width:72px;height:100px;border-radius:4px;flex-shrink:0;
  object-fit:cover;background:linear-gradient(135deg,#2a3a6a,#1a2a4a);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.book-highlight{
  background:rgba(240,180,40,.12);
  border-left:3px solid var(--yellow);
  padding:7px 10px;margin:8px 0;
  font-style:italic;font-size:12px;color:rgba(240,180,40,.85);
  border-radius:0 4px 4px 0;line-height:1.6;
}
.book-comment{font-size:13px;color:rgba(255,255,255,.65);line-height:1.7;}
.book-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px;}
.weread-btn{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:10px;font-size:11px;color:rgba(240,180,40,.7);
  text-decoration:none;border:1px solid rgba(240,180,40,.3);
  padding:4px 10px;border-radius:999px;transition:all .2s;font-family:sans-serif;
}
.weread-btn:hover{color:var(--yellow);border-color:var(--yellow);background:rgba(240,180,40,.08);}

/* CONTACT */
#contact{background:var(--cream2);padding:80px clamp(16px,5vw,80px);}
.c-btn{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(74,32,5,.08);color:var(--brown);transition:background .2s,color .2s,transform .18s,box-shadow .2s;}
.c-btn:hover{background:var(--yellow);color:#1a0800;transform:translateY(-4px);box-shadow:0 8px 20px rgba(240,180,40,.35);}

/* ═══ LIFE ONLINE — RPG GAME SCREEN ═══ */
#life-ov{
  position:fixed;inset:0;z-index:200;
  background:#07080f;
  display:none;overflow-y:auto;
  background-image:
    radial-gradient(rgba(83,74,183,.08) 1px,transparent 1px),
    radial-gradient(rgba(55,138,221,.04) 1px,transparent 1px);
  background-size:28px 28px,14px 14px;
  background-position:0 0,7px 7px;
}
#life-ov::-webkit-scrollbar{width:4px}
#life-ov::-webkit-scrollbar-thumb{background:var(--purple);border-radius:2px}

/* Game HUD bar */
.game-hud{
  position:sticky;top:0;z-index:10;
  background:rgba(7,8,15,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(83,74,183,.3);
  padding:10px 20px;
  display:flex;justify-content:space-between;align-items:center;
  font-family:monospace;font-size:11px;letter-spacing:.1em;
  color:rgba(127,119,221,.7);
}
.game-hud span{display:flex;align-items:center;gap:6px;}
.hud-dot{width:6px;height:6px;border-radius:50%;background:var(--purple2);box-shadow:0 0 6px var(--purple2);animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* RPG card base */
.rpg{
  border-radius:12px;padding:20px;margin-bottom:12px;
  opacity:0;transform:translateY(40px);
  background:rgba(42,42,62,.7);
  border:1px solid rgba(83,74,183,.3);
  backdrop-filter:blur(4px);
  position:relative;overflow:hidden;
}
.rpg::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(to right,transparent,rgba(127,119,221,.4),transparent);
}
.game-sec{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--purple2);margin-bottom:14px;font-family:monospace;display:flex;align-items:center;gap:8px;}
.game-sec::after{content:'';flex:1;height:1px;background:rgba(83,74,183,.25);}

/* Character card */
.char-layout{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;}
.char-frame{
  width:88px;height:88px;border-radius:10px;overflow:hidden;flex-shrink:0;
  border:2px solid var(--purple);position:relative;
  box-shadow:0 0 20px rgba(83,74,183,.4),inset 0 0 20px rgba(0,0,0,.3);
}
.char-frame img{width:100%;height:100%;object-fit:cover;}
.char-frame-fb{display:none;width:100%;height:100%;background:#378ADD;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;}
.char-lv-pip{
  position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  background:var(--purple);color:#fff;font-size:9px;font-weight:700;
  padding:1px 8px;border-radius:4px 4px 0 0;letter-spacing:.06em;font-family:monospace;
  white-space:nowrap;
}
.char-info{flex:1;min-width:180px;}
.char-name-big{font-size:20px;font-weight:900;color:#fff;margin-bottom:2px;}
.char-class-tag{font-size:11px;color:var(--purple2);letter-spacing:.08em;font-family:monospace;margin-bottom:12px;}
/* HP/MP bars */
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.stat-lbl{font-size:10px;font-weight:700;font-family:monospace;letter-spacing:.06em;width:22px;flex-shrink:0;}
.stat-lbl.hp{color:#e84040;}
.stat-lbl.mp{color:#378ADD;}
.stat-track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;}
.stat-track-fill{height:100%;border-radius:4px;width:0;transition:width 1s ease;}
.hp-fill{background:linear-gradient(to right,#a01010,#e84040);}
.mp-fill{background:linear-gradient(to right,#1a3a8a,#378ADD);}
.stat-val{font-size:10px;color:rgba(255,255,255,.45);font-family:monospace;width:58px;text-align:right;flex-shrink:0;}
.char-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.char-badge-tag{font-size:10px;color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.1);padding:2px 7px;border-radius:4px;font-family:monospace;}

/* RPG Player layout: EQUIP | DORAEMON | EQUIP */
.rpg-player{display:grid;grid-template-columns:1fr 148px 1fr;gap:10px;align-items:center;margin-bottom:18px;}
.equip-side{display:flex;flex-direction:column;gap:8px;}
.eq-slot{
  border-radius:8px;padding:10px 8px;
  border:1px solid;position:relative;overflow:hidden;
  cursor:default;transition:transform .18s,box-shadow .2s;
  background:rgba(7,8,20,.7);
}
.eq-slot:hover{transform:scale(1.03);}
.eq-slot-label{font-size:8px;font-family:monospace;letter-spacing:.1em;opacity:.45;margin-bottom:1px;}
.eq-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:3px;}
.eq-lv{display:inline-block;font-size:8px;font-family:monospace;padding:1px 5px;border-radius:3px;color:#fff;margin-bottom:5px;}
.eq-stats{list-style:none;}
.eq-stats li{font-size:10px;font-family:monospace;color:rgba(255,255,255,.6);line-height:1.7;}
/* Floating +N particle */
.eq-particle{position:absolute;font-family:monospace;font-size:13px;font-weight:700;pointer-events:none;z-index:10;white-space:nowrap;text-shadow:0 0 8px currentColor;}
/* Doraemon center */
.dora-center{display:flex;flex-direction:column;align-items:center;gap:6px;}
.dora-name-plate{background:rgba(83,74,183,.35);border:1px solid rgba(83,74,183,.55);border-radius:6px;padding:4px 10px;font-family:monospace;font-size:11px;color:#fff;text-align:center;white-space:nowrap;}
.dora-lv-plate{font-size:9px;font-family:monospace;color:var(--purple2);letter-spacing:.1em;}
/* Doraemon float animation */
@keyframes doraFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dora-svg-wrap{animation:doraFloat 3.5s ease-in-out infinite;}
@media(max-width:599px){
  .rpg-player{grid-template-columns:1fr 120px 1fr;gap:6px;}
}

/* Achievements */
.ach-grid{display:flex;flex-wrap:wrap;gap:8px;}
.ach-badge{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:5px;
  background:rgba(239,159,39,.08);
  border:1px solid rgba(239,159,39,.3);
  font-size:12px;font-weight:600;color:var(--yellow);
  transition:box-shadow .2s;font-family:monospace;
}
.ach-badge:hover{box-shadow:0 0 12px rgba(239,159,39,.25);}

/* Timeline / Quest Log */
.tl{border-left:2px solid rgba(83,74,183,.4);padding-left:20px;}
.tl-n{position:relative;padding-bottom:18px;cursor:pointer;}
.tl-dot{position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--purple);border:2px solid var(--purple2);transition:background .2s;}
.tl-n:hover .tl-dot{background:var(--blue2);}
.tl-story{display:none;margin-top:4px;font-size:12px;color:#AFA9EC;line-height:1.65;padding:6px 10px;background:rgba(83,74,183,.1);border-radius:4px;}
.tl-n.open .tl-story{display:block}
.tl-v{display:inline-block;font-size:10px;color:var(--purple2);margin-left:4px;transition:transform .18s;}
.tl-n.open .tl-v{transform:rotate(180deg)}

/* Vortex */
#vortex{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;overflow:hidden;}
#vortex.on{display:flex}
#vortex-c{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#020308 0%,#07080f 50%,#07080f 100%);transform:scale(0) rotate(0deg);box-shadow:0 0 80px 40px #07080f;}

/* WeChat modal / Toast / Close */
#wc-modal{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);}
#wc-modal.on{display:flex}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--purple);color:#fff;padding:9px 22px;border-radius:999px;font-size:13px;z-index:9999;transition:transform .3s;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0)}
#close-lv{position:fixed;top:52px;right:16px;z-index:210;width:38px;height:38px;border-radius:6px;background:rgba(83,74,183,.4);border:1px solid rgba(83,74,183,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .18s;font-family:monospace;}
#close-lv:hover{background:rgba(83,74,183,.7);}

@media(max-width:767px){
  .hero-veil{background:linear-gradient(to bottom,rgba(6,12,22,.95) 0%,rgba(6,12,22,.85) 60%,rgba(6,12,22,.6) 100%);}
  .flip-wrap{height:270px!important}
  .char-layout{flex-direction:column;}
}
</style>
</head>

<script>
const isMob=()=>window.innerWidth<768;
const noMo=()=>window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const getLv=()=>new Date().getFullYear()-CONFIG.birthYear;

// Seeded RNG
function makeRng(seed){
  let s=seed;
  return{
    n(min=0,max=1){s=(s*1664525+1013904223)&0xFFFFFFFF;const v=(s>>>0)/4294967296;return min+v*(max-min);},
    pick(arr){return arr[Math.floor(this.n(0,arr.length))];}
  };
}

// ── VAN GOGH CANVAS ──────────────────────
(function(){
  const cv=document.getElementById('vg-canvas');
  const cx=cv.getContext('2d');
  const rng=makeRng(12345);
  function bs(x1,y1,cpx,cpy,x2,y2,col,w,a=.7){cx.save();cx.globalAlpha=a;cx.strokeStyle=col;cx.lineWidth=w;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();cx.moveTo(x1,y1);cx.quadraticCurveTo(cpx,cpy,x2,y2);cx.stroke();cx.restore();}
  function draw(){
    const W=cv.width,H=cv.height;
    cx.clearRect(0,0,W,H);cx.fillStyle='#06101e';cx.fillRect(0,0,W,H);
    const sky=['#0d2540','#152e52','#1a3a6b','#0f2244','#1e3d6e','#173358','#0a1e38','#0c2448'];
    const swX=W*.72,swY=H*.38;
    for(let i=0;i<2200;i++){const x=rng.n(0,W),y=rng.n(0,H*1.05);const angle=Math.atan2(y-swY,x-swX)+1.3+rng.n(-.2,.2);const len=rng.n(18,62);bs(x,y,x+Math.cos(angle)*len*.5+rng.n(-6,6),y+Math.sin(angle)*len*.5+rng.n(-6,6),x+Math.cos(angle)*len,y+Math.sin(angle)*len,rng.pick(sky),rng.n(3,10),rng.n(.28,.65));}
    const sL=['#2a5a8a','#1e4a7a','#1a4060','#244e6e'];
    for(let i=0;i<500;i++){const x=rng.n(W*.35,W),y=rng.n(0,H*.55);const a=rng.n(0,Math.PI*2);const l=rng.n(20,65);bs(x,y,x+Math.cos(a)*l*.5,y+Math.sin(a)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l,rng.pick(sL),rng.n(2,7),rng.n(.15,.45));}
    const Y=['#f0b429','#daa520','#e8c040','#ffd700','#c89010'],O=['#cc6600','#e07b22','#b85500'],G=['#2d6a2d','#4a7a2d','#1d4a1d','#366b1d'],B=['#1a0800','#2d0e00','#3d1c02','#4a2005'];
    [{fx:.76,fy:.58,sz:72,t:.08},{fx:.88,fy:.40,sz:88,t:.04},{fx:.64,fy:.72,sz:54,t:-.12},{fx:.93,fy:.68,sz:58,t:.18},{fx:.56,fy:.85,sz:40,t:-.08}].forEach(f=>{
      const cx2=W*f.fx,cy2=H*f.fy,sz=f.sz*(isMob()?.65:1);
      for(let i=0;i<10;i++){const off=rng.n(-6,6);bs(cx2+off,H*1.02,cx2+rng.n(-18,18),(H*1.02+cy2)/2,cx2+off*.4,cy2+sz*.85,rng.pick(G),rng.n(5,12),rng.n(.6,.85));}
      for(let i=0;i<6;i++){const lY=cy2+sz*1.6+rng.n(0,sz*.5),dir=f.t>=0?-1:1;bs(cx2+rng.n(-5,5),lY,cx2+dir*55+rng.n(-12,12),lY-rng.n(18,38),cx2+dir*48+rng.n(-8,8),lY-rng.n(10,22),rng.pick(G),rng.n(6,13),rng.n(.45,.72));}
      for(let j=0;j<14;j++){const ang=(j/14)*Math.PI*2+f.t+rng.n(-.04,.04),pl=sz*rng.n(1.3,1.72),px1=cx2+Math.cos(ang)*sz*.42,py1=cy2+Math.sin(ang)*sz*.42,px2=cx2+Math.cos(ang)*pl,py2=cy2+Math.sin(ang)*pl;bs(px1,py1,cx2+Math.cos(ang+.22)*sz*rng.n(.85,1.1)+rng.n(-8,8),cy2+Math.sin(ang+.22)*sz*rng.n(.85,1.1)+rng.n(-8,8),px2,py2,rng.pick(Y),sz*.30,rng.n(.72,.95));bs(px1,py1,cx2+Math.cos(ang-.22)*sz*rng.n(.85,1.1)+rng.n(-8,8),cy2+Math.sin(ang-.22)*sz*rng.n(.85,1.1)+rng.n(-8,8),px2,py2,rng.pick([...Y,...O]),sz*.18,rng.n(.45,.75));}
      for(let k=0;k<90;k++){const a=rng.n(0,Math.PI*2),r1=rng.n(0,sz*.65),r2=rng.n(0,sz*.65);bs(cx2+Math.cos(a)*r1,cy2+Math.sin(a)*r1,cx2+Math.cos(a+.3)*(r1+r2)*.5+rng.n(-5,5),cy2+Math.sin(a+.3)*(r1+r2)*.5+rng.n(-5,5),cx2+Math.cos(a+.6)*r2,cy2+Math.sin(a+.6)*r2,rng.pick(B),rng.n(3,8),rng.n(.65,.92));}
    });
    const g=cx.createRadialGradient(W*.76,H*.55,0,W*.76,H*.55,W*.38);g.addColorStop(0,'rgba(240,180,40,.11)');g.addColorStop(.4,'rgba(200,130,20,.05)');g.addColorStop(1,'transparent');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  }
  function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;draw();}
  resize();let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,200);});
})();

(function(){
  const g=document.getElementById('books-grid');
  CONFIG.books.forEach(b=>{
    const myBadge = b.myHighlight ? `<span style="font-size:10px;color:var(--yellow);font-family:monospace;margin-left:6px;">✏️ 我的划线</span>` : '';
    const coverHtml = b.cover

         <span style="display:none;font-size:26px;width:100%;height:100%;align-items:center;justify-content:center;">${b.emoji}</span>`
      : `<span style="font-size:26px;">${b.emoji}</span>`;
    const card=document.createElement('div');card.className='book-card';
    card.innerHTML=`
      <div class="book-cover" style="background:linear-gradient(135deg,#1a2a4a,#0a1a2a);display:flex;align-items:center;justify-content:center;">${coverHtml}</div>
      <div style="flex:1;min-width:0;">
        <h3 class="book-title">${b.title}${myBadge}</h3>
        <p style="font-size:11px;color:rgba(255,255,255,.35);margin-bottom:7px;font-family:sans-serif;letter-spacing:.03em;">${b.author}</p>
        <div class="book-highlight">"${b.highlight}"</div>
        <p class="book-comment">${b.comment}</p>
        <a href="${b.weread}" target="_blank" rel="noopener noreferrer" class="weread-btn">
          <i data-lucide="book-open" style="width:11px;height:11px;"></i>
          在微信读书看
        </a>
      </div>`;
    g.appendChild(card);
  });
  lucide.createIcons();

  // ── 书架区 Van Gogh 背景（不同种子，花朵偏左下）──
  (function(){
    const cv=document.getElementById('books-canvas');
    if(!cv) return;
    const cx=cv.getContext('2d');
    const rng=makeRng(54321); // 不同种子
    function bs(x1,y1,cpx,cpy,x2,y2,col,w,a=.7){cx.save();cx.globalAlpha=a;cx.strokeStyle=col;cx.lineWidth=w;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();cx.moveTo(x1,y1);cx.quadraticCurveTo(cpx,cpy,x2,y2);cx.stroke();cx.restore();}
    function draw(){
      const W=cv.width,H=cv.height;
      cx.clearRect(0,0,W,H);cx.fillStyle='#050e1a';cx.fillRect(0,0,W,H);
      const sky=['#0b2038','#122840','#183055','#0a1c30','#162a4a','#0e2238'];
      const swX=W*.3,swY=H*.4;
      for(let i=0;i<1600;i++){const x=rng.n(0,W),y=rng.n(0,H);const angle=Math.atan2(y-swY,x-swX)+1.4+rng.n(-.25,.25);const len=rng.n(16,55);bs(x,y,x+Math.cos(angle)*len*.5+rng.n(-5,5),y+Math.sin(angle)*len*.5+rng.n(-5,5),x+Math.cos(angle)*len,y+Math.sin(angle)*len,rng.pick(sky),rng.n(3,9),rng.n(.25,.6));}
      const Y=['#f0b429','#daa520','#e8c040','#ffd700'],O=['#cc6600','#e07b22'],G=['#2d6a2d','#4a7a2d','#1d4a1d'],B=['#1a0800','#2d0e00','#3d1c02'];
      // 少量花朵散布在画面
      [{fx:.12,fy:.7,sz:42},{fx:.28,fy:.85,sz:55},{fx:.82,fy:.6,sz:48},{fx:.95,fy:.8,sz:36}].forEach(f=>{
        const cx2=W*f.fx,cy2=H*f.fy,sz=f.sz*(isMob()?.6:1);
        for(let i=0;i<8;i++){const off=rng.n(-4,4);bs(cx2+off,H*1.02,cx2+rng.n(-14,14),(H*1.02+cy2)/2,cx2+off*.3,cy2+sz*.8,rng.pick(G),rng.n(4,10),rng.n(.55,.8));}
        for(let j=0;j<12;j++){const ang=(j/12)*Math.PI*2+rng.n(-.04,.04),pl=sz*rng.n(1.3,1.7),px1=cx2+Math.cos(ang)*sz*.4,py1=cy2+Math.sin(ang)*sz*.4,px2=cx2+Math.cos(ang)*pl,py2=cy2+Math.sin(ang)*pl;bs(px1,py1,cx2+Math.cos(ang+.2)*sz*rng.n(.85,1.1)+rng.n(-7,7),cy2+Math.sin(ang+.2)*sz*rng.n(.85,1.1)+rng.n(-7,7),px2,py2,rng.pick(Y),sz*.28,rng.n(.7,.95));}
        for(let k=0;k<70;k++){const a=rng.n(0,Math.PI*2),r1=rng.n(0,sz*.6),r2=rng.n(0,sz*.6);bs(cx2+Math.cos(a)*r1,cy2+Math.sin(a)*r1,cx2+Math.cos(a+.3)*(r1+r2)*.5+rng.n(-4,4),cy2+Math.sin(a+.3)*(r1+r2)*.5+rng.n(-4,4),cx2+Math.cos(a+.6)*r2,cy2+Math.sin(a+.6)*r2,rng.pick(B),rng.n(3,7),rng.n(.6,.9));}
      });
    }
    function resize(){cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;draw();}
    // 等 section 渲染完再量高度
    setTimeout(()=>{resize();},100);
    let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,200);});
  })();
})();

// ── RPG GAME SCREEN ───────────────────────
(function(){
  const lv=getLv();
  document.getElementById('play-yrs').textContent=lv;
  document.getElementById('cn').textContent=CONFIG.character.name;
  document.getElementById('cl').textContent='Lv.'+lv;
  document.getElementById('cj').textContent=CONFIG.character.job;
  // HP = Lv × 10, MP = skill sum × 100/40
  const skillSum=CONFIG.equipment.reduce((a,e)=>a+e.lv,0);
  const maxHP=lv*10, curHP=maxHP;
  const maxMP=100, curMP=Math.round(skillSum/40*100);
  document.getElementById('hp-val').textContent=`${curHP}/${maxHP}`;
  document.getElementById('mp-val').textContent=`${curMP}/${maxMP}`;
  document.getElementById('hp-bar').dataset.w=Math.round(curHP/maxHP*100);
  document.getElementById('mp-bar').dataset.w=curMP;

  // Equipment: left side = [0,2], right side = [1,3]
  function makeEqSlot(eq){
    const slot=document.createElement('div');
    slot.className='eq-slot';
    slot.style.borderColor=eq.color+'55';
    slot.innerHTML=`
      <div class="eq-slot-label">${eq.slot} ${eq.icon}</div>
      <div class="eq-name">${eq.name}</div>
      <span class="eq-lv" style="background:${eq.color}28;color:${eq.color};">Lv.${eq.lv}</span>
      <ul class="eq-stats">${eq.stats.map(s=>`<li style="color:${eq.color}cc;">${s}</li>`).join('')}</ul>`;
    slot.addEventListener('mouseenter',()=>{slot.style.boxShadow=`0 0 14px ${eq.color}44`;slot.style.borderColor=eq.color+'99';});
    slot.addEventListener('mouseleave',()=>{slot.style.boxShadow='none';slot.style.borderColor=eq.color+'55';});
    return slot;
  }
  document.getElementById('eq-left').appendChild(makeEqSlot(CONFIG.equipment[0]));
  document.getElementById('eq-left').appendChild(makeEqSlot(CONFIG.equipment[2]));
  document.getElementById('eq-right').appendChild(makeEqSlot(CONFIG.equipment[1]));
  document.getElementById('eq-right').appendChild(makeEqSlot(CONFIG.equipment[3]));

  // Floating +N particles
  function spawnParticle(){
    const slots=document.querySelectorAll('.eq-slot');
    if(!slots.length) return;
    const slot=slots[Math.floor(Math.random()*slots.length)];
    const color=slot.querySelector('.eq-lv').style.color;
    const p=document.createElement('span');
    p.className='eq-particle';
    p.textContent='+'+Math.floor(Math.random()*8+1);
    p.style.cssText=`left:${15+Math.random()*70}%;bottom:8px;color:${color};`;
    slot.appendChild(p);
    gsap.to(p,{y:-(40+Math.random()*30),opacity:0,duration:1.4+Math.random()*.4,ease:'power2.out',onComplete:()=>p.remove()});
  }
  let particleInterval=null;

  // Achievements
  const al=document.getElementById('acl');
  CONFIG.achievements.forEach(a=>{
    const b=document.createElement('div');b.className='ach-badge';
    b.innerHTML=`<i data-lucide="award" style="width:11px;height:11px;color:var(--yellow);"></i>${a}`;
    al.appendChild(b);
  });

  // Timeline
  const tl=document.getElementById('tll');
  CONFIG.timeline.forEach(item=>{
    const n=document.createElement('div');n.className='tl-n';n.tabIndex=0;
    n.innerHTML=`<div class="tl-dot"></div><span style="font-size:10px;font-weight:700;color:var(--blue2);font-family:monospace;">${item.year}</span><p style="font-size:13px;color:#fff;margin-top:1px;">${item.event}<span class="tl-v">▼</span></p><p class="tl-story">${item.story}</p>`;
    n.addEventListener('click',()=>n.classList.toggle('open'));
    n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();n.classList.toggle('open');}});
    tl.appendChild(n);
  });

  lucide.createIcons();

  // Expose for openLife
  window._startParticles=()=>{
    if(particleInterval) return;
    particleInterval=setInterval(spawnParticle,900);
  };
  window._stopParticles=()=>{
    clearInterval(particleInterval);particleInterval=null;
  };
})();

// ── LIFE PANEL OPEN/CLOSE ─────────────────
const PANELS=['#rv-char','#rv-ac','#rv-tl'];

function openLife(){
  const ov=document.getElementById('life-ov');
  const vw=document.getElementById('vortex');
  const hero=document.getElementById('hero');
  if(!isMob()&&!noMo()){
    vw.classList.add('on');
    const vc=document.getElementById('vortex-c');
    gsap.set(vc,{scale:0,rotation:0});
    gsap.to(hero,{scale:.9,opacity:0,duration:.85,ease:'power2.in'});
    gsap.to(vc,{scale:28,rotation:540,duration:1.2,ease:'power3.in',onComplete(){
      ov.style.display='block';ov.scrollTop=0;
      vw.classList.remove('on');gsap.set(vc,{scale:0,rotation:0});
      gsap.set(hero,{scale:1,opacity:1});
      _ap();
    }});
  } else {
    ov.style.display='block';ov.scrollTop=0;
    gsap.fromTo(ov,{opacity:0},{opacity:1,duration:.35});
    _ap();
  }
  setTimeout(()=>document.getElementById('close-lv').focus(),200);
}
function closeLife(){
  const ov=document.getElementById('life-ov');
  window._stopParticles();
  if(!isMob()&&!noMo()){
    gsap.to(PANELS,{opacity:0,y:18,duration:.2,stagger:.03,ease:'power2.in',onComplete(){ov.style.display='none';gsap.set(PANELS,{opacity:0,y:40});_rb();}});
  } else {
    gsap.to(ov,{opacity:0,duration:.28,onComplete(){ov.style.display='none';gsap.set(ov,{opacity:1});gsap.set(PANELS,{opacity:0,y:40});_rb();}});
  }
}
function _ap(){
  gsap.fromTo(PANELS,{opacity:0,y:42},{opacity:1,y:0,duration:.55,stagger:.13,ease:'back.out(1.2)',delay:.05});
  setTimeout(()=>{
    document.querySelectorAll('.stat-track-fill').forEach(b=>gsap.to(b,{width:b.dataset.w+'%',duration:1.2,ease:'power2.out'}));
    window._startParticles();
  },500);
}
function _rb(){
  document.querySelectorAll('.stat-track-fill').forEach(b=>gsap.set(b,{width:'0%'}));
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('life-ov').style.display==='block')closeLife();});
gsap.registerPlugin(ScrollTrigger);
</script>
